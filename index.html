<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>集市 · 音乐插件</title>
<style>
  :root{
    --earth:#8b5a2b;      /* 赭石 */
    --sand:#d9b382;       /* 土黄 */
    --sand-lt:#f0dcbb;
    --paper:#f6e7cd;
    --ink:#3b2412;
    --vermilion:#b8382c;  /* 朱红 */
    --leaf:#6b8e23;       /* 草绿 */
    --shadow:rgba(59,36,18,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,.55), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(107,142,35,.20), transparent 46%),
      repeating-linear-gradient(45deg, rgba(139,90,43,.05) 0 12px, rgba(139,90,43,0) 12px 24px),
      linear-gradient(160deg,#f7ead3 0%, #efd9b6 48%, #e6c9a0 100%);
    min-height:100vh;
    padding:0 16px 132px;
  }

  /* ============ 顶部插件主题卡片 ============ */
  .hero{
    position:relative;
    max-width:880px;
    margin:28px auto 30px;
    border-radius:26px;
    overflow:hidden;
    box-shadow:0 18px 40px -18px var(--shadow), 0 0 0 1px rgba(139,90,43,.35);
    background:var(--earth);
    isolation:isolate;
  }
  .hero-art{
    position:absolute;inset:0;
    background-image:url("插件海报.png");
    background-size:cover;background-position:center;
    filter:saturate(.92) contrast(1.02);
    z-index:-2;
  }
  .hero-art::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(100deg, rgba(59,36,18,.86) 0%, rgba(59,36,18,.58) 45%, rgba(59,36,18,.30) 100%);
  }
  .hero-inner{padding:34px 30px 30px;color:#fdf3df}
  .tag{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12px;letter-spacing:.18em;
    padding:6px 12px;border-radius:999px;
    background:rgba(253,243,223,.16);
    border:1px solid rgba(253,243,223,.4);
    backdrop-filter:blur(4px);
  }
  .hero h1{
    font-size:clamp(46px,11vw,84px);
    letter-spacing:.22em;
    margin:14px 0 6px;
    font-weight:800;
    text-shadow:0 4px 0 rgba(59,36,18,.45), 0 0 26px rgba(217,179,130,.5);
  }
  .hero .sub{font-size:15px;opacity:.9;max-width:34em;line-height:1.75}
  .hero-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
  .stat{
    background:rgba(253,243,223,.14);
    border:1px solid rgba(253,243,223,.32);
    border-radius:12px;padding:8px 14px;font-size:13px;
  }
  .stat b{font-size:16px;margin-right:4px}

  /* ============ 分类区块 ============ */
  .section{max-width:880px;margin:0 auto 26px}
  .sec-head{display:flex;align-items:center;gap:12px;margin:0 4px 14px}
  .sec-no{
    width:30px;height:30px;flex:none;border-radius:9px;
    background:var(--vermilion);color:#fff8e6;
    display:grid;place-items:center;font-size:14px;font-weight:700;
    box-shadow:0 3px 0 rgba(59,36,18,.35);
  }
  .sec-title{font-size:20px;font-weight:700;letter-spacing:.06em}
  .sec-tip{margin-left:auto;font-size:12.5px;color:rgba(59,36,18,.62)}
  .sec-title span{color:var(--vermilion)}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}

  /* 音乐卡片 */
  .card{
    position:relative;
    background:linear-gradient(170deg,var(--paper),var(--sand-lt));
    border:2px solid rgba(139,90,43,.4);
    border-radius:18px;
    padding:16px 16px 14px;
    cursor:pointer;
    box-shadow:0 6px 0 -2px rgba(139,90,43,.22), 0 12px 22px -14px var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 0 -2px rgba(139,90,43,.28), 0 18px 26px -14px var(--shadow)}
  .card.sel{
    border-color:var(--vermilion);
    background:linear-gradient(170deg,#fdf0d4,#f3dcae);
    box-shadow:0 8px 0 -2px rgba(184,56,44,.3), 0 0 0 4px rgba(184,56,44,.14);
  }
  .card .idx{
    position:absolute;top:12px;right:14px;
    font-size:11px;color:rgba(59,36,18,.45);letter-spacing:.1em;
  }
  .card h4{
    font-size:16px;font-weight:700;line-height:1.5;
    padding-right:34px;word-break:break-all;margin-bottom:4px;
  }
  .card .dur{font-size:12px;color:rgba(59,36,18,.55);margin-bottom:12px;font-variant-numeric:tabular-nums}

  .ctrl{display:flex;align-items:center;gap:11px}
  .play{
    width:42px;height:42px;flex:none;border:none;border-radius:50%;
    background:var(--earth);color:#fdf3df;cursor:pointer;
    display:grid;place-items:center;transition:transform .15s ease, background .15s ease;
    box-shadow:0 3px 0 rgba(59,36,18,.4);
  }
  .play:hover{background:var(--vermilion);transform:scale(1.06)}
  .play:active{transform:scale(.96)}
  .play svg{width:16px;height:16px;fill:currentColor;margin-left:2px}
  .play.playing svg{margin-left:0}

  .wave{
    flex:1;height:30px;display:flex;align-items:center;gap:2.5px;
    overflow:hidden;
  }
  .wave i{
    flex:1;min-width:2px;max-width:3px;border-radius:2px;
    background:rgba(139,90,43,.42);
  }
  .card.sel .wave i{background:rgba(184,56,44,.6)}
  .play:not(.playing) ~ .wave i{height:6px!important}
  .play.playing ~ .wave i{animation:eq .9s ease-in-out infinite}
  @keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}

  .pick{
    margin-top:13px;
    display:flex;align-items:center;gap:8px;
    font-size:12.5px;color:rgba(59,36,18,.6);
  }
  .radio{
    width:19px;height:19px;flex:none;border-radius:50%;
    border:2px solid rgba(139,90,43,.55);
    display:grid;place-items:center;
    transition:all .18s ease;
  }
  .radio::after{
    content:"";width:9px;height:9px;border-radius:50%;
    background:var(--vermilion);transform:scale(0);transition:transform .2s cubic-bezier(.34,1.56,.64,1);
  }
  .card.sel .radio{border-color:var(--vermilion)}
  .card.sel .radio::after{transform:scale(1)}
  .card.sel .pick{color:var(--vermilion);font-weight:700}

  /* 已选印章 */
  .stamp{
    position:absolute;bottom:12px;right:14px;
    font-size:11px;letter-spacing:.1em;
    color:#fdf3df;background:var(--vermilion);
    padding:4px 9px;border-radius:6px;
    opacity:0;transform:scale(.5) rotate(-12deg);
    transition:all .28s cubic-bezier(.34,1.56,.64,1);
    pointer-events:none;
  }
  .card.sel .stamp{opacity:1;transform:scale(1) rotate(-8deg)}

  /* ============ 底部栏 ============ */
  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(246,231,205,.92);
    backdrop-filter:blur(12px);
    border-top:2px solid rgba(139,90,43,.35);
    box-shadow:0 -10px 30px -18px var(--shadow);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .dock-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .picked-list{display:flex;gap:8px;flex:1;min-width:220px;flex-wrap:wrap}
  .chip{
    font-size:12.5px;padding:7px 12px;border-radius:999px;
    background:rgba(139,90,43,.14);border:1px solid rgba(139,90,43,.3);
    color:rgba(59,36,18,.78);
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .chip.done{background:rgba(107,142,35,.2);border-color:rgba(107,142,35,.5);color:#4a6414;font-weight:600}
  .chip.empty{opacity:.5;font-style:italic}
  .btn{
    border:none;border-radius:14px;padding:14px 26px;
    font-size:15px;font-weight:700;letter-spacing:.08em;
    cursor:pointer;transition:transform .16s ease, filter .16s ease;
    box-shadow:0 4px 0 rgba(59,36,18,.4);
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,36,18,.4)}
  .btn-primary{background:linear-gradient(180deg,#c8452f,#a72e22);color:#fff6e2}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-primary:disabled{background:#c3ae8d;color:rgba(59,36,18,.5);cursor:not-allowed;box-shadow:none}

  /* ============ 相机区域 ============ */
  .camera{
    position:fixed;inset:0;z-index:90;
    background:rgba(28,18,10,.9);
    backdrop-filter:blur(8px);
    display:none;align-items:center;justify-content:center;
    padding:24px 16px;
  }
  .camera.on{display:flex;animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .cam-body{
    width:100%;max-width:520px;
    background:linear-gradient(180deg,#241a12,#171009);
    border:1px solid rgba(217,179,130,.35);
    border-radius:20px;
    padding:18px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.8);
  }
  .cam-top{display:flex;align-items:center;gap:8px;padding:0 4px 12px}
  .lamp{width:9px;height:9px;border-radius:50%;background:var(--vermilion);box-shadow:0 0 10px var(--vermilion)}
  .cam-top span{font-size:12px;letter-spacing:.2em;color:rgba(217,179,130,.7)}
  .cam-top .rec{margin-left:auto;font-size:11px;color:#e0574a;letter-spacing:.1em;display:flex;align-items:center;gap:5px}

  .viewfinder{
    position:relative;
    border-radius:12px;
    overflow:hidden;
    background:#0d0906;
    aspect-ratio:720/1280;
    display:grid;place-items:center;
  }
  .viewfinder canvas{max-width:100%;max-height:70vh;display:block}
  .corner{position:absolute;width:26px;height:26px;border:2px solid rgba(253,243,223,.75)}
  .c1{top:10px;left:10px;border-right:0;border-bottom:0}
  .c2{top:10px;right:10px;border-left:0;border-bottom:0}
  .c3{bottom:10px;left:10px;border-right:0;border-top:0}
  .c4{bottom:10px;right:10px;border-left:0;border-top:0}

  .focus{
    position:absolute;inset:0;display:grid;place-items:center;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 2px,transparent 2px 4px);
    color:#fdf3df;font-size:13px;letter-spacing:.2em;
  }
  .focus.hide{display:none}
  .shutter-flash{
    position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;
  }
  .shutter-flash.go{animation:flash .5s ease-out}
  @keyframes flash{0%{opacity:.92}100%{opacity:0}}

  .grid-lines{position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(to right,transparent 33.2%,rgba(253,243,223,.16) 33.2%,rgba(253,243,223,.16) 33.5%,transparent 33.5%,transparent 66.4%,rgba(253,243,223,.16) 66.4%,rgba(253,243,223,.16) 66.7%,transparent 66.7%),
      linear-gradient(to bottom,transparent 33.2%,rgba(253,243,223,.16) 33.2%,rgba(253,243,223,.16) 33.5%,transparent 33.5%,transparent 66.4%,rgba(253,243,223,.16) 66.4%,rgba(253,243,223,.16) 66.7%,transparent 66.7%);
  }

  .cam-actions{display:flex;gap:10px;margin-top:14px}
  .cam-actions .btn{flex:1}
  .btn-ghost{background:transparent;color:rgba(253,243,223,.8);border:1px solid rgba(217,179,130,.45);box-shadow:none}
  .btn-ghost:hover{background:rgba(217,179,130,.12)}
  .hint{font-size:11.5px;color:rgba(217,179,130,.6);text-align:center;margin-top:10px;line-height:1.7}

  @media (max-width:520px){
    .hero-inner{padding:26px 20px 22px}
    .btn{padding:13px 18px}
    .sec-tip{display:none}
  }
</style>
</head>
<body>

<!-- ===== 顶部主题卡片 ===== -->
<header class="hero">
  <div class="hero-art"></div>
  <div class="hero-inner">
    <div class="tag">◆ 乡土中国版 · 插件</div>
    <h1>集 市</h1>
    <p class="sub">把宋朝街市的喧闹装进耳朵里。集市广场的热闹、商铺柜台的讨价还价、散集角落的闲谈——三条声景，各选其一，合成属于你的一集。</p>
    <div class="hero-stats">
      <div class="stat"><b>3</b>组声景</div>
      <div class="stat"><b>6</b>首曲目</div>
      <div class="stat"><b>1</b>张专属票据</div>
      <div class="stat">作者：dcve</div>
    </div>
  </div>
</header>

<!-- ===== 分类区块（JS 渲染） ===== -->
<main id="app"></main>

<!-- ===== 底部操作栏 ===== -->
<div class="dock">
  <div class="dock-in">
    <div class="picked-list" id="pickedList"></div>
    <button class="btn btn-primary" id="shareBtn" disabled>📷 一键分享</button>
  </div>
</div>

<!-- ===== 相机区域 ===== -->
<div class="camera" id="camera">
  <div class="cam-body">
    <div class="cam-top">
      <i class="lamp"></i><span>MARKET CAM</span>
      <div class="rec">● REC</div>
    </div>

    <div class="viewfinder" id="viewfinder">
      <div class="focus" id="focusMsg">正在冲洗票据…</div>
      <div class="grid-lines"></div>
      <i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i>
      <div class="shutter-flash" id="flash"></div>
      <canvas id="ticket" width="720" height="1280"></canvas>
    </div>

    <div class="cam-actions">
      <button class="btn btn-ghost" id="closeBtn">返回修改</button>
      <button class="btn btn-primary" id="dlBtn">⬇ 保存票据</button>
    </div>
    <div class="hint">长按图片亦可保存 · 竖版 720 × 1280 · 三类各一首，不可更改张数</div>
  </div>
</div>

<audio id="au"></audio>

<script>
/* ============ 数据 ============ */
const DATA = [
  {
    name: "集市广场主 BGM", no: "壹", tip: "主场景 · 人声鼎沸",
    items: [
      { title: "集市广场主 BGM（1）", file: "BGM/集市广场主 BGM（1）.mp3" },
      { title: "集市广场主 BGM（2）", file: "BGM/集市广场主 BGM（2）.mp3" }
    ]
  },
  {
    name: "商铺经营和货柜面板", no: "贰", tip: "经营界面 · 讨价还价",
    items: [
      { title: "商铺经营以及货柜面板（1）", file: "BGM/商铺经营以及货柜面板（1）.mp3" },
      { title: "商铺经营以及货柜面板（2）", file: "BGM/商铺经营以及货柜面板（2）.mp3" }
    ]
  },
  {
    name: "散集音乐", no: "叁", tip: "边角小集 · 闲话家常",
    items: [
      { title: "散集(1)", file: "BGM/散集(1).mp3" },
      { title: "散集(2)", file: "BGM/散集(2).mp3" }
    ]
  }
];

const sel = [null, null, null];   // 每类选中的曲目下标
const au = document.getElementById('au');
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

const fmt = s => {
  if (isNaN(s)) return "--:--";
  return Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0");
};
const waveBars = n => Array.from({length:n},(_,i)=>{
  const h = 8 + Math.abs(Math.sin(i*0.7))*18 + (i%3)*3;
  return `<i style="height:${h}px;animation-delay:${(i*0.06).toFixed(2)}s"></i>`;
}).join("");

/* ============ 渲染卡片 ============ */
const app = document.getElementById('app');
app.innerHTML = DATA.map((g,gi)=>`
  <section class="section">
    <div class="sec-head">
      <div class="sec-no">${g.no}</div>
      <div class="sec-title"><span>${g.name}</span></div>
      <div class="sec-tip">${g.tip} · 每类选 1 首</div>
    </div>
    <div class="cards">
      ${g.items.map((it,ii)=>`
        <div class="card" data-g="${gi}" data-i="${ii}">
          <div class="idx">${g.no}·${ii+1}</div>
          <h4>${it.title}</h4>
          <div class="dur" data-dur>时长 --:--</div>
          <div class="ctrl">
            <button class="play" data-g="${gi}" data-i="${ii}" aria-label="播放">${ICON_PLAY}</button>
            <div class="wave">${waveBars(22)}</div>
          </div>
          <div class="pick"><span class="radio"></span><span class="pick-txt">选为${g.name}</span></div>
          <div class="stamp">已 选</div>
        </div>
      `).join("")}
    </div>
  </section>
`).join("");

const cards = [...document.querySelectorAll('.card')];

/* ============ 选择状态 ============ */
function refreshSelection(){
  cards.forEach(c=>{
    const g=+c.dataset.g, i=+c.dataset.i;
    c.classList.toggle('sel', sel[g]===i);
  });
  // 底部 chips
  const box = document.getElementById('pickedList');
  box.innerHTML = DATA.map((g,gi)=>{
    const it = sel[gi]===null ? null : g.items[sel[gi]];
    return it
      ? `<span class="chip done">${g.no}·${it.title}</span>`
      : `<span class="chip empty">${g.no}·待选择</span>`;
  }).join("");
  document.getElementById('shareBtn').disabled = sel.some(v=>v===null);
}
cards.forEach(c=>{
  c.addEventListener('click', e=>{
    if(e.target.closest('.play')) return;   // 播放按钮不触发选择
    const g=+c.dataset.g, i=+c.dataset.i;
    sel[g] = (sel[g]===i) ? null : i;       // 再点一次取消
    refreshSelection();
  });
});
refreshSelection();

/* ============ 音频播放（互斥） ============ */
let playingCard = null;
document.querySelectorAll('.play').forEach(btn=>{
  btn.addEventListener('click', e=>{
    e.stopPropagation();
    const g=+btn.dataset.g, i=+btn.dataset.i;
    const item = DATA[g].items[i];
    if(playingCard === btn){
      au.pause(); playingCard=null; paintPlay();
      return;
    }
    document.querySelectorAll('.play').forEach(b=>b.classList.remove('playing'));
    document.querySelectorAll('.play').forEach(b=>b.innerHTML=ICON_PLAY);
    au.src = item.file;
    au.play().then(()=>{ playingCard=btn; btn.classList.add('playing'); btn.innerHTML=ICON_PAUSE; })
             .catch(()=>{
               btn.classList.add('playing'); btn.innerHTML=ICON_PAUSE;
               alert("音频加载失败：请确认 BGM 文件夹与本页面在同一层目录下，且六个 mp3 文件名未被改动。");
             });
  });
});
function paintPlay(){
  document.querySelectorAll('.play').forEach(b=>{
    const on = b===playingCard;
    b.classList.toggle('playing', on);
    b.innerHTML = on ? ICON_PAUSE : ICON_PLAY;
  });
}

/* 读时长 */
DATA.forEach((g,gi)=>g.items.forEach((it,ii)=>{
  const probe = new Audio();
  probe.preload='metadata';
  probe.src = it.file;
  probe.addEventListener('loadedmetadata', ()=>{
    const card = document.querySelector(`.card[data-g="${gi}"][data-i="${ii}"] [data-dur]`);
    if(card) card.textContent = '时长 ' + fmt(probe.duration);
  });
}));

au.addEventListener('ended', paintPlay);

/* ============ 绘制竖版票据 ============ */
const INK='#3b2412', VER='#b8382c', EARTH='#8b5a2b', LEAF='#6b8e23';

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}
function vText(c,txt,x,y,size,gap,color,weight='700'){
  c.font = `${weight} ${size}px "STKaiti","KaiTi","PingFang SC",serif`;
  c.fillStyle = color; c.textAlign='center'; c.textBaseline='middle';
  [...txt].forEach((ch,i)=>c.fillText(ch, x, y+i*(size+gap)));
}
function ticketCode(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  const t=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}`;
  const alpha = 'ACDEFHKLMNPRTUVWXY3479';   // 22 位，避免再除出越界
  let r='';
  for(let i=0;i<4;i++) r+= alpha[Math.floor(Math.random()*alpha.length)];
  return { no:`MT-${t}-${r}`, date:`${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}` };
}
const ri = ()=> String(Math.floor(Math.random()*9)+1).padStart(2,'0');
function drawTicket(){
  const c = document.getElementById('ticket').getContext('2d');
  const W=720,H=1280;
  const {no,date} = ticketCode();

  c.clearRect(0,0,W,H);

  /* 纸底 */
  const bg=c.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#f7e9cd'); bg.addColorStop(.5,'#f2ddb8'); bg.addColorStop(1,'#ead0a4');
  c.fillStyle=bg; c.fillRect(0,0,W,H);

  /* 纸纹噪点 */
  for(let i=0;i<2600;i++){
    c.fillStyle = Math.random()<.5 ? 'rgba(139,90,43,.055)' : 'rgba(255,255,255,.09)';
    c.fillRect(Math.random()*W, Math.random()*H, 1.6, 1.6);
  }
  /* 四角旧色 */
  const vg=c.createRadialGradient(W/2,H/2,H*0.28,W/2,H/2,H*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(120,80,30,.22)');
  c.fillStyle=vg; c.fillRect(0,0,W,H);

  /* 上下齿孔 */
  const punch=(y)=>{
    c.fillStyle='#1b120a';
    for(let x=18;x<W;x+=34){ c.beginPath(); c.arc(x,y,9,0,7); c.fill(); }
  };
  c.save();
  c.beginPath(); c.rect(0,18,W,H-36); c.clip();
  punch(0); punch(H);
  c.restore();

  /* 外框 */
  c.strokeStyle='rgba(139,90,43,.75)'; c.lineWidth=3;
  c.strokeRect(26,26,W-52,H-52);
  c.strokeStyle='rgba(139,90,43,.45)'; c.lineWidth=1.5;
  c.strokeRect(36,36,W-72,H-72);

  /* ---- 顶部：印章 + 主标题 ---- */
  c.save();
  c.translate(96,116);
  c.rotate(-0.12);
  c.strokeStyle=VER; c.lineWidth=4; c.fillStyle='rgba(184,56,44,.13)';
  roundRect(c,-52,-52,104,104,12); c.fill(); c.stroke();
  c.fillStyle=VER; c.textAlign='center'; c.textBaseline='middle';
  c.font='700 44px "STKaiti","KaiTi",serif';
  c.fillText('集',0,-26); c.fillText('市',0,26);
  c.restore();

  c.textAlign='left'; c.textBaseline='alphabetic';
  c.fillStyle=INK;
  c.font='700 54px "STKaiti","KaiTi",serif';
  c.fillText('宋朝 · 集市声景',170,100);
  c.fillStyle=VER; c.font='700 19px "PingFang SC",sans-serif';
  c.fillText('乡 土 中 国 版  ·  音 乐 插 件 联 动 票',172,132);
  c.strokeStyle='rgba(139,90,43,.5)'; c.lineWidth=2;
  c.beginPath(); c.moveTo(40,168); c.lineTo(W-40,168); c.stroke();

  /* ---- 中部：三条所选（整幅宽度，标题自适应字号，不做粗暴截断） ---- */
  const listY = 232;
  const slotH = 190;
  DATA.forEach((g,gi)=>{
    const y = listY + gi*slotH;
    const it = g.items[sel[gi]];
    /* 底纹 */
    c.fillStyle = gi%2 ? 'rgba(255,255,255,.34)' : 'rgba(255,255,255,.16)';
    roundRect(c,40,y,W-80,slotH-22,12); c.fill();
    c.strokeStyle='rgba(139,90,43,.32)'; c.lineWidth=1.5; c.stroke();

    /* 序号 */
    c.fillStyle=VER;
    roundRect(c,58,y+26,46,46,9); c.fill();
    c.fillStyle='#fdf3df'; c.textAlign='center'; c.textBaseline='middle';
    c.font='700 24px "STKaiti","KaiTi",serif';
    c.fillText(g.no,81,y+49);

    /* 分类 */
    c.textAlign='left'; c.textBaseline='alphabetic';
    c.fillStyle=EARTH; c.font='700 25px "STKaiti","KaiTi",serif';
    c.fillText(g.name,122,y+42);

    /* 曲目：字号自适应，超长才省略 */
    const label = it ? it.title.replace(/(\.mp3)$/i,'') : '—';
    const maxW = W - 200;
    let size = 40;
    c.font = `700 ${size}px "STKaiti","KaiTi",serif`;
    while(c.measureText(label).width > maxW && size > 24){
      size -= 2;
      c.font = `700 ${size}px "STKaiti","KaiTi",serif`;
    }
    let show = label;
    if(c.measureText(show).width > maxW){
      while(show.length > 3 && c.measureText(show+'…').width > maxW) show = show.slice(0,-1);
      show += '…';
    }
    c.fillStyle=INK;
    c.fillText(show,122,y+88+size*0.14);

    /* 一行元信息 */
    c.fillStyle='rgba(59,36,18,.55)'; c.font='18px "PingFang SC",sans-serif';
    c.fillText(`${g.tip}  ｜  曲目 ${it ? 'No.0'+(sel[gi]+1) : '--'}`,122,y+142);

    /* 选中勾 */
    if(it){
      c.strokeStyle=LEAF; c.lineWidth=3.5;
      c.beginPath(); c.arc(W-92,y+52,20,0,7); c.stroke();
      c.beginPath(); c.moveTo(W-101,y+52); c.lineTo(W-95,y+59); c.lineTo(W-83,y+44); c.stroke();
    }
  });

  /* ---- 底部：场次信息 ---- */
  const fy = listY + 3*slotH + 6;
  c.strokeStyle='rgba(139,90,43,.5)'; c.lineWidth=2;
  c.beginPath(); c.moveTo(40,fy); c.lineTo(W-40,fy); c.stroke();
  c.setLineDash([6,6]);
  c.beginPath(); c.moveTo(40,fy+14); c.lineTo(W-40,fy+14); c.stroke();
  c.setLineDash([]);

  /* 右侧竖排印记（独立放在底部信息区右侧，不与信息行重叠） */
  /* 右侧竖排印记：顶部右侧空白处，两列并排竖排，避免向下溢出 */
  const VS = 15, VG = 5;
  const blockH = VS*4 + VG*3;            // 单列四字高度
  const vw = 82, vh = blockH + 28;
  const vx = 604, vy = 42;
  c.fillStyle='rgba(184,56,44,.07)';
  roundRect(c,vx,vy,vw,vh,9); c.fill();
  c.strokeStyle='rgba(184,56,44,.6)'; c.lineWidth=2;
  roundRect(c,vx,vy,vw,vh,9); c.stroke();
  vText(c,'凭票入场',vx+22,vy+VS/2+8,VS,VG,VER);   // 右列先读
  vText(c,'一券一集',vx+60,vy+VS/2+8,VS,VG,EARTH);

  const rows = [
    ['场　次', '宋朝 · 汴京集市'],
    ['日　期', date],
    ['席　位', `广场 ${ri()} 席 · 商铺 ${ri()} 席 · 散集 ${ri()} 席`],
    ['票　号', no]
  ];
  rows.forEach((r,i)=>{
    const y = fy+52+i*38;
    c.textAlign='left'; c.textBaseline='alphabetic';
    c.fillStyle='rgba(59,36,18,.6)'; c.font='20px "PingFang SC",sans-serif';
    c.fillText(r[0],56,y);
    c.fillStyle=INK; c.font='700 22px "PingFang SC",sans-serif';
    c.fillText(r[1],140,y);
  });

  /* 条码 */
  const bx=56, by=fy+226, bw=W-112, bh=76;
  c.fillStyle='#fdf6e6'; c.fillRect(bx,by,bw,bh);
  c.strokeStyle='rgba(59,36,18,.3)'; c.lineWidth=1; c.strokeRect(bx,by,bw,bh);
  let x=bx+10;
  c.fillStyle=INK;
  while(x < bx+bw-12){
    const w = 2+Math.floor(Math.random()*5);
    if(Math.random()>.32) c.fillRect(x,by+8,w,bh-34);   // 条码只占上半区
    x += w + 2 + Math.floor(Math.random()*4);
  }
  c.font='14px "PingFang SC",monospace'; c.textAlign='center';
  c.fillStyle='rgba(59,36,18,.75)';
  c.fillText(no, bx+bw/2, by+bh-8);                     // 编号单独一行，不压条码

  /* 底部小字 */
  c.textAlign='center';
  c.fillStyle='rgba(59,36,18,.5)'; c.font='17px "PingFang SC",sans-serif';
  c.fillText('本票据由「集市」插件生成 · 三类声景各一首 · 祝君逛得尽兴', W/2, fy+324);
  c.fillStyle=VER; c.font='700 16px "PingFang SC",sans-serif';
  c.fillText('— 凭 此 票 入 集 市 —', W/2, fy+354);
}

/* ============ 相机交互 ============ */
const cam = document.getElementById('camera');
const focusMsg = document.getElementById('focusMsg');
const flash = document.getElementById('flash');

document.getElementById('shareBtn').addEventListener('click', ()=>{
  cam.classList.add('on');
  focusMsg.classList.remove('hide');
  drawTicket();
  flash.classList.remove('go');
  setTimeout(()=>{
    flash.classList.add('go');           // 快门闪
    focusMsg.classList.add('hide');
  },420);
});
document.getElementById('closeBtn').addEventListener('click', ()=>{
  cam.classList.remove('on');
});
cam.addEventListener('click', e=>{ if(e.target===cam) cam.classList.remove('on'); });

/* 下载 */
document.getElementById('dlBtn').addEventListener('click', ()=>{
  const {date} = ticketCode();
  const a = document.createElement('a');
  a.download = `集市票据_${date.replace(/\./g,'')}.png`;
  a.href = document.getElementById('ticket').toDataURL('image/png');
  document.body.appendChild(a); a.click(); a.remove();
});

/* 票据长按保存（移动端） */
const tk = document.getElementById('ticket');
tk.addEventListener('contextmenu', e=>e.preventDefault());
</script>
